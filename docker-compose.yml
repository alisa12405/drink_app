name: drink-app

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-Smart Drink}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://drinks.hmmh.click}
  LOG_CHANNEL: stderr
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-drink_app}
  DB_USERNAME: ${DB_USERNAME:-drink_app}
  DB_PASSWORD: ${DB_PASSWORD:-change_me_secret}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_CLIENT: phpredis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
  OPENAI_RERANK_MODEL: ${OPENAI_RERANK_MODEL:-gpt-4o-mini}
  OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-10}
  OPENAI_RERANK_TIMEOUT: ${OPENAI_RERANK_TIMEOUT:-15}
  WEATHER_API_PROVIDER: ${WEATHER_API_PROVIDER:-openweather}
  WEATHER_API_KEY: ${WEATHER_API_KEY:-}
  WEATHER_TIMEOUT: ${WEATHER_TIMEOUT:-3}
  WEATHER_CACHE_TTL: ${WEATHER_CACHE_TTL:-1800}
  RECOMMENDATION_TIMEZONE: ${RECOMMENDATION_TIMEZONE:-Asia/Ho_Chi_Minh}
  RECOMMENDATION_RATE_LIMIT_PER_MINUTE: ${RECOMMENDATION_RATE_LIMIT_PER_MINUTE:-5}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: drink-app-php
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    environment: *backend-environment
    volumes:
      - drink-app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drink-app-network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: drink-app-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--queue=embeddings,default", "--sleep=1", "--tries=3", "--timeout=30"]
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
      SKIP_APP_BOOTSTRAP: "true"
    volumes:
      - drink-app-storage:/var/www/html/storage
    depends_on:
      webserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "redis:embeddings", "--max=100"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - drink-app-network

  webserver:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: drink-app-webserver
    restart: unless-stopped
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/drinks"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - drink-app-network

  site:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: drink-app-site
    restart: unless-stopped
    depends_on:
      webserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - drink-app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: drink-app-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      site:
        condition: service_healthy
    networks:
      - drink-app-network

  db:
    image: mysql:8.0
    container_name: drink-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-drink_app}
      MYSQL_USER: ${DB_USERNAME:-drink_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_secret}
    volumes:
      - drink-app-db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-change_me_root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - drink-app-network

  redis:
    image: redis:7-alpine
    container_name: drink-app-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - drink-app-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - drink-app-network

volumes:
  drink-app-db-data:
  drink-app-redis-data:
  drink-app-storage:

networks:
  drink-app-network:
    driver: bridge
